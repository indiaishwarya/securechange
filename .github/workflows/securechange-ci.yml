name: SecureChange CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run tests
        run: |
          cd backend
          pytest -q

      - name: Run benchmark
        run: |
          cd backend
          python -c "from app.evaluation import evaluate_benchmark; result=evaluate_benchmark(); print(result['metrics'])"

      - name: Install security analyzers
        run: python -m pip install bandit semgrep

      - name: Run Bandit
        run: bandit -r backend/app -f json -o bandit-report.json --exit-zero

      - name: Run Semgrep
        run: semgrep --config auto --json backend/app > semgrep-report.json || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securechange-security-reports
          path: |
            bandit-report.json
            semgrep-report.json

      - name: Comment on pull request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "## SecureChange CI",
              "",
              "- Tests and benchmark executed",
              "- Bandit and Semgrep reports uploaded as workflow artifacts",
              "",
              "Review the artifacts and SecureChange dashboard for evidence-grounded findings."
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
